      ea_guid: "EAID_199B695F_644C_4cbf_AB67_76AB51EE5078"
    abstract: true
    class_uri: cim:TapChangerTablePoint
    attributes: 
      b:
        description: "The magnetizing branch susceptance deviation as a percentage of nominal value. The actual susceptance is calculated as follows:calculated magnetizing susceptance = b(nominal) * (1 + b(from this class)/100).   The b(nominal) is defined as the static magnetizing susceptance on the associated power transformer end or ends. This model assumes the star impedance (pi model) form."
        annotations:
          ea_guid: "EAID_EA68668F_E3EE_4702_978C_26D6BCED0B86"
        slot_uri: cim:TapChangerTablePoint.b
        range: PerCent
        minimum_cardinality: 0
        maximum_cardinality: 1
      g:
        description: "The magnetizing branch conductance deviation as a percentage of nominal value. The actual conductance is calculated as follows:calculated magnetizing conductance = g(nominal) * (1 + g(from this class)/100).   The g(nominal) is defined as the static magnetizing conductance on the associated power transformer end or ends. This model assumes the star impedance (pi model) form. Note that the upper boundary is not constrained to 100 percent."
        annotations:
          ea_guid: "EAID_F33BB85C_0624_4ff6_BA15_DBDA563BB4FB"
        slot_uri: cim:TapChangerTablePoint.g
        range: PerCent
        minimum_cardinality: 0
        maximum_cardinality: 1
      r:
        description: "The resistance deviation as a percentage of nominal value. The actual reactance is calculated as follows:calculated resistance = r(nominal) * (1 + r(from this class)/100). The r(nominal) is defined as the static resistance on the associated power transformer end or ends. This model assumes the star impedance (pi model) form. Note that the upper boundary is not constrained to 100 percent."
        annotations:
          ea_guid: "EAID_81B79598_EB65_43c7_A0E5_B982F1EDF158"
        slot_uri: cim:TapChangerTablePoint.r
        range: PerCent
        minimum_cardinality: 0
        maximum_cardinality: 1
      ratio:
        description: "The voltage at the tap step divided by rated voltage of the transformer end having the tap changer. Hence this is a value close to one.For example, if the ratio at step 1 is 1.01, and the rated voltage of the transformer end is 110kV, then the voltage obtained by setting the tap changer to step 1 to is 111.1kV."
        annotations:
          ea_guid: "EAID_4357132D_9216_46a0_A5B0_6C3F0DCC7876"
        slot_uri: cim:TapChangerTablePoint.ratio
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      step:
        description: "The tap step."
        annotations:
          ea_guid: "EAID_4941A374_B3BD_4b4e_9F28_C44B88440D16"
        slot_uri: cim:TapChangerTablePoint.step
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      x:
        description: "The series reactance deviation as a percentage of nominal value. The actual reactance is calculated as follows:calculated reactance = x(nominal) * (1 + x(from this class)/100). The x(nominal) is defined as the static series reactance on the associated power transformer end or ends. This model assumes the star impedance (pi model) form. Note that the upper boundary is not constrained to 100 percent."
        annotations:
          ea_guid: "EAID_55B6B5C3_6A91_4136_936A_8AF71058D544"
