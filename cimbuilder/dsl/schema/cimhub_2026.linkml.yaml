classes:
  ACDCTerminal:
    description: "An electrical connection point (AC or DC) to a piece of conducting equipment. Terminals are connected at physical connection points called connectivity nodes."
    annotations:
      ea_guid: "EAID_6B722669_A267_4897_B20A_99ADB8FBC629"
    is_a: IdentifiedObject
    abstract: true
    class_uri: cim:ACDCTerminal
    attributes: 
      connected:
        description: "The connected status is related to a bus-branch model and the topological node to terminal relation. True implies the terminal is connected to the related topological node and false implies it is not.In a bus-branch model, the connected status is used to tell if equipment is disconnected without having to change the connectivity described by the topological node to terminal relation. A valid case is that conducting equipment can be connected in one end and open in the other. In particular for an AC line segment, where the reactive line charging can be significant, this is a relevant case."
        annotations:
          ea_guid: "EAID_C97C0B38_C62F_4f03_A3DE_A67F29A6C6DB"
        slot_uri: cim:ACDCTerminal.connected
        range: boolean
        minimum_cardinality: 0
        maximum_cardinality: 1
      sequenceNumber:
        description: "The orientation of the terminal connections for a multiple terminal conducting equipment. The sequence numbering starts with 1 and additional terminals should follow in increasing order. The first terminal is the starting point for a two terminal branch."
        annotations:
          ea_guid: "EAID_7C7195D3_DFCD_487f_BF92_F359BBE7AFD0"
        slot_uri: cim:ACDCTerminal.sequenceNumber
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      BusNameMarker:
        description: "The bus name marker used to name the bus (topological node)."
        annotations:
          ea_guid: "EAID_DEB63E42_070A_4d24_B07E_E4A60ACFDAEC-B"
        slot_uri: cim:ACDCTerminal.BusNameMarker
        range: BusNameMarker
        minimum_cardinality: 0
        maximum_cardinality: 1
  ACLineSegment:
    description: "A line segment is a conductor or combination of conductors, with consistent electrical characteristics along its length, building a single electrical system that carries alternating current between two points in the power system.The BaseVoltage at the two ends of a line segment shall have the same BaseVoltage.nominalVoltage. However, boundary lines may have slightly different BaseVoltage.nominalVoltages and variation is allowed. Larger voltage difference in general requires use of an equivalent branch.Line segment impedances can be either directly described in electrical terms or physical line detail can be provided from which impedances can be calculated.<b>Directly described impedances</b>For symmetrical, transposed three phase line segments, it is sufficient to use attributes of the line segment, which describe impedances and admittances for the entire length of the line segment.  Additionally, line segment impedances can be computed by using line segment length and associated per length impedances.Unbalanced modeling of impedances is supported by the per length phase impedance matrix (PerLengthPhaseImpedance) in conjunction with phase-to-sequence number mapping supplied by either ACLineSegmentPhase or WirePosition. The sequence numbers are referenced by the row and column attributes of the per length phase impedance matrix. This method enables single-phase and two-phase line segments, and transpositions of phases, to be described using the same per length phase impedance matrix. The length of the line segment is used in the computation of total impedance values for the line segment.<b>Line detail characteristics</b>There are three approaches to providing line detail and all use WireAssembly to supply line positions:<ul>	<li>Option 1 - WireAssembly supplies only line positions. ACLineSegmentPhase points to wire type and intraphase spacing and supplies the phase-to-sequence number mapping.</li>	<li>Option 2 - WireAssembly supplies line position and, for each position, also supplies wire type and intraphase spacing. ACLineSegmentPhase supplies the phase-to-sequence number mapping.</li>	<li>Option 3 - WireAssembly supplies line position and, for each position, also supplies wire type and intraphase spacing and phase. WireAssembly therefore supplies the phase-to-sequence number mapping and ACLineSegmentPhase is not needed.</li></ul>"
    annotations:
      ea_guid: "EAID_5C0F7C30_AB03_460e_AA13_589D2B4269E0"
    is_a: Conductor
    class_uri: cim:ACLineSegment
    attributes: 
      b0ch:
        description: "Zero sequence shunt (charging) susceptance, uniformly distributed, of the entire line segment."
        annotations:
          ea_guid: "EAID_5EE8B645_9FB5_4985_8930_6CB5CAA29CE2"
        slot_uri: cim:ACLineSegment.b0ch
        range: Susceptance
        minimum_cardinality: 0
        maximum_cardinality: 1
      bch:
        description: "Positive sequence shunt (charging) susceptance, uniformly distributed, of the entire line segment.  This value represents the full charging over the full length of the line segment."
