    description: "An electrical device consisting of  two or more coupled windings, with or without a magnetic core, for introducing mutual coupling between electric circuits. Transformers can be used to control voltage and phase shift (active power flow).A power transformer may be composed of separate transformer tanks that need not be identical.A power transformer can be modelled with or without tanks and is intended for use in both balanced and unbalanced representations. A power transformer typically has two terminals, but may have one (grounding), three or more terminals.The inherited association ConductingEquipment.BaseVoltage should not be used. The association from TransformerEnd to BaseVoltage should be used instead."
    annotations:
      ea_guid: "EAID_3D50627C_324C_4e9d_AB5C_592E0A1E0AFE"
    is_a: ConductingEquipment
    abstract: true
    class_uri: cim:PowerTransformer
    attributes: 
      beforeShCircuitHighestOperatingCurrent:
        description: "The highest operating current (Ib in IEC 60909-0) before short circuit (depends on network configuration and relevant reliability philosophy). It is used for calculation of the impedance correction factor KT defined in IEC 60909-0."
        annotations:
          ea_guid: "EAID_AE4EA8D2_F7DE_4b53_BB69_AC364144A1CF"
        slot_uri: cim:PowerTransformer.beforeShCircuitHighestOperatingCurrent
        range: CurrentFlow
        minimum_cardinality: 0
        maximum_cardinality: 1
      beforeShCircuitHighestOperatingVoltage:
        description: "The highest operating voltage (Ub in IEC 60909-0) before short circuit. It is used for calculation of the impedance correction factor KT defined in IEC 60909-0. This is worst case voltage on the low side winding (3.7.1 of IEC 60909:2001). Used to define operating conditions."
        annotations:
          ea_guid: "EAID_4E3E92DC_A260_4f23_87CC_E569FF4567A7"
        slot_uri: cim:PowerTransformer.beforeShCircuitHighestOperatingVoltage
        range: Voltage
        minimum_cardinality: 0
        maximum_cardinality: 1
      beforeShortCircuitAnglePf:
        description: "The angle of power factor before short circuit (phib in IEC 60909-0). It is used for calculation of the impedance correction factor KT defined in IEC 60909-0. This is the worst case power factor. Used to define operating conditions."
        annotations:
          ea_guid: "EAID_041C6D4A_4D33_416b_869F_3546D7B28527"
        slot_uri: cim:PowerTransformer.beforeShortCircuitAnglePf
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
      highSideMinOperatingU:
        description: "The minimum operating voltage (uQmin in IEC 60909-0) at the high voltage side (Q side) of the unit transformer of the power station unit. A value well established from long-term operating experience of the system. It is used for calculation of the impedance correction factor KG defined in IEC 60909-0."
        annotations:
          ea_guid: "EAID_B621D953_1CCB_4d6e_AE7D_6231CCE96831"
        slot_uri: cim:PowerTransformer.highSideMinOperatingU
        range: Voltage
        minimum_cardinality: 0
        maximum_cardinality: 1
      isPartOfGeneratorUnit:
        description: "Indicates whether the machine is part of a power station unit. Used for short circuit data exchange according to IEC 60909.  It has an impact on how the correction factors are calculated for transformers, since the transformer is not necessarily part of a synchronous machine and generating unit. It is not always possible to derive this information from the model. This is why the attribute is necessary."
        annotations:
          ea_guid: "EAID_90536F90_2FEE_4023_A72F_58DACED054DC"
        slot_uri: cim:PowerTransformer.isPartOfGeneratorUnit
        range: boolean
        minimum_cardinality: 0
        maximum_cardinality: 1
      operationalValuesConsidered:
        description: "It is used to define if the data (other attributes related to short circuit data exchange) defines long term operational conditions or not. Used for short circuit data exchange according to IEC 60909."
        annotations:
          ea_guid: "EAID_48CE1171_4EB3_4eb0_981D_28AE7ABB7F49"
        slot_uri: cim:PowerTransformer.operationalValuesConsidered
        range: boolean
        minimum_cardinality: 0
        maximum_cardinality: 1
      vectorGroup:
        description: "Vector group of the transformer for protective relaying, e.g., Dyn1. For unbalanced transformers, this may not be simply determined from the constituent winding connections and phase angle displacements.The vectorGroup string consists of the following components in the order listed: high voltage winding connection, mid voltage winding connection (for three winding transformers), phase displacement clock number from 0 to 11,  low voltage winding connectionphase displacement clock number from 0 to 11.   The winding connections are D (delta), Y (wye), YN (wye with neutral), Z (zigzag), ZN (zigzag with neutral), A (auto transformer). Upper case means the high voltage, lower case mid or low. The high voltage winding always has clock position 0 and is not included in the vector group string.  Some examples: YNy0 (two winding wye to wye with no phase displacement), YNd11 (two winding wye to delta with 330 degrees phase displacement), YNyn0d5 (three winding transformer wye with neutral high voltage, wye with neutral mid voltage and no phase displacement, delta low voltage with 150 degrees displacement).Phase displacement is defined as the angular difference between the phasors representing the voltages between the neutral point (real or imaginary) and the corresponding terminals of two windings, a positive sequence voltage system being applied to the high-voltage terminals, following each other in alphabetical sequence if they are lettered, or in numerical sequence if they are numbered: the phasors are assumed to rotate in a counter-clockwise sense."
        annotations:
          ea_guid: "EAID_5A4A0AC2_AE76_4849_9563_015909DD9F2F"
        slot_uri: cim:PowerTransformer.vectorGroup
        range: string
        minimum_cardinality: 0
        maximum_cardinality: 1
  PowerTransformerEnd:
    description: "A PowerTransformerEnd is associated with each Terminal of a PowerTransformer.The impedance values r, r0, x, and x0 of a PowerTransformerEnd represents a star equivalent as follows.1) two PowerTransformerEnd-s shall be defined for a two Terminal PowerTransformer even if the two PowerTransformerEnd-s have the same rated voltage. The high voltage PowerTransformerEnd (TransformerEnd.endNumber=1) is the one used to exchange resistances (r, r0) and reactances (x, x0) of the PowerTransformer while the low voltage PowerTransformerEnd (TransformerEnd.endNumber=2) shall have zero impedance values.2) for a three Terminal PowerTransformer the three PowerTransformerEnds represent a star equivalent with each leg in the star represented by r, r0, x, and x0 values.3) For a three Terminal transformer each PowerTransformerEnd shall have g, g0, b and b0 values corresponding to the no load losses distributed on the three PowerTransformerEnds. The total no load loss shunt impedances may also be placed at one of the PowerTransformerEnds, preferably the end numbered 1, having the shunt values on end 1.  This is the preferred way.4) for a PowerTransformer with more than three Terminals the PowerTransformerEnd impedance values cannot be used. Instead use the TransformerMeshImpedance or split the transformer into multiple PowerTransformers.Each PowerTransformerEnd must be contained by a PowerTransformer. Because a PowerTransformerEnd (or any other object) can not be contained by more than one parent, a PowerTransformerEnd can not have an association to an EquipmentContainer (Substation, VoltageLevel, etc)."
    annotations:
      ea_guid: "EAID_51A671B1_C546_4106_92F9_ED7C0305A2DB"
    is_a: TransformerEnd
    abstract: true
    class_uri: cim:PowerTransformerEnd
    attributes: 
      b:
        description: "Magnetizing branch susceptance (B mag).  The value can be positive or negative."
        annotations:
          ea_guid: "EAID_049B7FAE_6F21_4fa4_9BDC_744C262C99AB"
        slot_uri: cim:PowerTransformerEnd.b
        range: Susceptance
        minimum_cardinality: 0
        maximum_cardinality: 1
      b0:
        description: "Zero sequence magnetizing branch susceptance."
        annotations:
          ea_guid: "EAID_9F90313E_3782_459e_A4BC_66938E5A52F5"
        slot_uri: cim:PowerTransformerEnd.b0
        range: Susceptance
        minimum_cardinality: 0
        maximum_cardinality: 1
      connectionKind:
        description: "Kind of connection."
        annotations:
          ea_guid: "EAID_BC71F2C6_F76B_459a_A7AF_04800FBD1AE6"
        slot_uri: cim:PowerTransformerEnd.connectionKind
        range: WindingConnection
        minimum_cardinality: 0
        maximum_cardinality: 1
      g:
        description: "Magnetizing branch conductance."
        annotations:
          ea_guid: "EAID_1DB7A689_A778_4f98_821B_549122D33482"
        slot_uri: cim:PowerTransformerEnd.g
        range: Conductance
        minimum_cardinality: 0
        maximum_cardinality: 1
      g0:
        description: "Zero sequence magnetizing branch conductance (star-model)."
        annotations:
          ea_guid: "EAID_40582586_E7A8_4d85_9328_02F6B38300A1"
        slot_uri: cim:PowerTransformerEnd.g0
        range: Conductance
        minimum_cardinality: 0
        maximum_cardinality: 1
      phaseAngleClock:
        description: "Terminal voltage phase angle displacement where 360 degrees are represented with clock hours. The valid values are 0 to 11. For example, for the secondary side end of a transformer with vector group code of 'Dyn11', specify the connection kind as wye with neutral and specify the phase angle of the clock as 11.  The clock value of the transformer end number specified as 1, is assumed to be zero.  Note the transformer end number is not assumed to be the same as the terminal sequence number."
        annotations:
          ea_guid: "EAID_D2BA85F8_D4BC_4f1a_824A_2B7E701EC65B"
        slot_uri: cim:PowerTransformerEnd.phaseAngleClock
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      r:
        description: "Resistance (star-model) of the transformer end.The attribute shall be equal to or greater than zero for non-equivalent transformers."
        annotations:
          ea_guid: "EAID_7B85D922_082E_482e_A2FB_D2164647BE6E"
        slot_uri: cim:PowerTransformerEnd.r
        range: Resistance
        minimum_cardinality: 0
        maximum_cardinality: 1
      r0:
        description: "Zero sequence series resistance (star-model) of the transformer end."
        annotations:
          ea_guid: "EAID_ED74BF4C_8DAC_425b_9352_4051C611F9BC"
        slot_uri: cim:PowerTransformerEnd.r0
        range: Resistance
        minimum_cardinality: 0
        maximum_cardinality: 1
      ratedS:
        description: "Normal apparent power rating.The attribute shall be a positive value. For a two-winding transformer the values for the high and low voltage sides shall be identical."
        annotations:
          ea_guid: "EAID_03C41DCA_8576_4294_B1A4_64D6289BC413"
        slot_uri: cim:PowerTransformerEnd.ratedS
        range: ApparentPower
        minimum_cardinality: 0
        maximum_cardinality: 1
      ratedU:
        description: "Rated voltage: phase-phase for three-phase windings, and either phase-phase or phase-neutral for single-phase windings.A high voltage side, as given by TransformerEnd.endNumber, shall have a ratedU that is greater than or equal to ratedU for the lower voltage sides.The attribute shall be a positive value."
        annotations:
          ea_guid: "EAID_38795744_6A3E_4a62_A8D9_E3FCF020A456"
        slot_uri: cim:PowerTransformerEnd.ratedU
        range: Voltage
        minimum_cardinality: 0
        maximum_cardinality: 1
      x:
        description: "Positive sequence series reactance (star-model) of the transformer end."
        annotations:
          ea_guid: "EAID_0DDEF3C0_D3D0_475e_8C6F_D7363D0E5AF4"
        slot_uri: cim:PowerTransformerEnd.x
        range: Reactance
        minimum_cardinality: 0
        maximum_cardinality: 1
      x0:
        description: "Zero sequence series reactance of the transformer end."
        annotations:
          ea_guid: "EAID_9F61AC19_7526_4234_AB78_F7FC96E9833F"
        slot_uri: cim:PowerTransformerEnd.x0
        range: Reactance
        minimum_cardinality: 0
        maximum_cardinality: 1
      PowerTransformer:
        description: "The power transformer of this power transformer end."
        annotations:
          ea_guid: "EAID_AAC9230B_982D_4588_BD28_882E60820FEA-B"
        slot_uri: cim:PowerTransformerEnd.PowerTransformer
        range: PowerTransformer
        minimum_cardinality: 0
        maximum_cardinality: 1
