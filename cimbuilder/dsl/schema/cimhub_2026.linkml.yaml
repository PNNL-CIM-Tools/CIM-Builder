  ControlArea:
    description: "A control area is a grouping of generating units and/or loads and a cutset of tie lines (as terminals) which may be used for a variety of purposes including automatic generation control, power flow solution area interchange control specification, and input to load forecasting. All generation and load within the area defined by the terminals on the border are considered in the area interchange control. Note that any number of overlapping control area specifications may be superimposed on the physical model. The following general principles apply to ControlArea:1.  The control area orientation for net interchange is positive for an import, negative for an export.2.  The control area net interchange is determined by summing flows in Terminals. The Terminals are identified by creating a set of TieFlow objects associated with a ControlArea object. Each TieFlow object identifies one Terminal.3.  In a single network model, a tie between two control areas must be modelled in both control area specifications, such that the two representations of the tie flow sum to zero.4.  The normal orientation of Terminal flow is positive for flow into the conducting equipment that owns the Terminal. (i.e. flow from a bus into a device is positive.) However, the orientation of each flow in the control area specification must align with the control area convention, i.e. import is positive. If the orientation of the Terminal flow referenced by a TieFlow is positive into the control area, then this is confirmed by setting TieFlow.positiveFlowIn flag TRUE. If not, the orientation must be reversed by setting the TieFlow.positiveFlowIn flag FALSE."
    annotations:
      ea_guid: "EAID_EB35F9FE_F63C_47f6_B2E8_774B9B2735C8"
    is_a: PowerSystemResource
    abstract: true
    class_uri: cim:ControlArea
    attributes: 
      netInterchange:
        description: "The specified positive net interchange into the control area, i.e. positive sign means flow into the area."
        annotations:
          ea_guid: "EAID_B02AFBB9_BD7F_45e4_B361_D0EDD5F7CB79"
        slot_uri: cim:ControlArea.netInterchange
        range: ActivePower
        minimum_cardinality: 0
        maximum_cardinality: 1
      pTolerance:
