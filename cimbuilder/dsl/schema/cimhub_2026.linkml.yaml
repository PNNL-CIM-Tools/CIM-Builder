  ConnectionAngleTapChanger:
    description: "Describes the tap model for an asymmetrical phase shifting transformer in which the difference voltage vector adds to the in-phase winding. The out-of-phase winding is the transformer end where the tap changer is located. The angle between the in-phase and out-of-phase windings is named the winding connection angle. The phase shift depends on both the difference voltage magnitude and the winding connection angle. The winding connection angle can be changed for different operating conditions while energized.The following options are supported:<ol>	<li>Modelling of tap changer using ConnectionAngleTapChanger without ConnectionAngleTapChangerTable. Equations for asymmetrical transformer defined in IEC 61970-301 are used. The supported winding connection angle range is defined by the maximum winding connection angle and the minimum winding connection angle. The connection angle step size is used to define the allowed winding connection angles for the tap changer.</li>	<li>Modelling of tap changer using ConnectionAngleTapChanger with ConnectionAngleTapChangerTable. There shall be different tables that relate to different winding connection angles that are supported by the tap changer. There is no need to provide information on winding connection angle range and connection angle step size as the allowed winding connection angles are defined by the table. The usage of the table is recommended in cases where the equations for asymmetrical transformer defined in IEC 61970-301 cannot fully describe the tap changer or in cases where it is exchange the data for different tap steps in an explicit way as a table.</li></ol>"
    annotations:
      ea_guid: "EAID_2454243C_F428_4fc1_B9CC_1C0C182A8084"
    is_a: PhaseTapChangerNonLinear
    abstract: true
    class_uri: cim:ConnectionAngleTapChanger
    attributes: 
      connectionAngleStepSize:
        description: "The supported winding connection angle range is defined by the maximum winding connection angle and the minimum winding connection angle. The connection angle step size is used to define the allowed winding connection angles for the tap changer. The attribute shall be a positive value and can only be multiples of 30 degrees. For example, if the tap changer has maximum winding connection angle equal to 60 degrees, minimum winding connection angle equal to -60 degrees and the connection angle step size is equal to 60, the allowed winding connection angle that can be used for this tap changer are -60 degrees, 0 degrees and -60 degrees. When using connection angle tap changer table there is no need to provide information on winding connection angle range and connection angle step size as the allowed winding connection angles are defined by the table."
        annotations:
          ea_guid: "EAID_5E26A30C_F462_4085_A300_DA9753822F41"
        slot_uri: cim:ConnectionAngleTapChanger.connectionAngleStepSize
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
      maxWindingConnectionAngle:
        description: "The maximum phase angle between the in-phase winding and the out-of -phase winding used for creating phase shift. The attribute can be positive, negative or zero and can only be multiples of 30 degrees. When 0 degree is used the asymmetrical phase tap changer acts as ratio tap changer controlling voltage. The maximum winding connection angle shall be greater than the minimum winding connection angle. When using connection angle tap changer table there is no need to provide information on winding connection angle range and connection angle step size as the allowed winding connection angles are defined by the table."
        annotations:
          ea_guid: "EAID_343EF4DB_A5B4_45c3_A2FB_5A2F04DC5770"
        slot_uri: cim:ConnectionAngleTapChanger.maxWindingConnectionAngle
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
      minWindingConnectionAngle:
        description: "The minimum phase angle between the in-phase winding and the out-of -phase winding used for creating phase shift. The attribute can be positive, negative or zero and can only be multiples of 30 degrees. When 0 degree is used the asymmetrical phase tap changer acts as ratio tap changer controlling voltage. When using connection angle tap changer table there is no need to provide information on winding connection angle range and connection angle step size as the allowed winding connection angles are defined by the table."
        annotations:
          ea_guid: "EAID_C7EA61AE_8007_4220_A91B_67726F145EFA"
        slot_uri: cim:ConnectionAngleTapChanger.minWindingConnectionAngle
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
      normalWindingConnectionAngle:
        description: "The normal phase angle between the in-phase winding and the out-of -phase winding used for creating phase shift. The out-of-phase winding produces what is known as the difference voltage. Setting this angle to 90 degrees is not the same as a symmetrical transformer. In this scenario you will still treat the 90-degree angle as a phase shifting transformer. The attribute can only be multiples of 30 degrees. When 0 degree is used the asymmetrical phase tap changer acts as ratio tap changer controlling voltage."
        annotations:
          ea_guid: "EAID_10139791_F808_4eeb_91D8_5896E8EF546F"
        slot_uri: cim:ConnectionAngleTapChanger.normalWindingConnectionAngle
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
      windingConnectionAngle:
        description: "The operating phase angle between the in-phase winding and the out-of -phase winding used for creating phase shift. The out-of-phase winding produces what is known as the difference voltage. Setting this angle to 90 degrees is not the same as a symmetrical transformer. In this scenario you will still treat the 90-degree angle as a phase shifting transformer. The attribute can only be multiples of 30 degrees. When 0 degree is used the asymmetrical phase tap changer acts as ratio tap changer controlling voltage."
        annotations:
          ea_guid: "EAID_85ED8D50_2D54_413a_98E7_593AA2678CE7"
        slot_uri: cim:ConnectionAngleTapChanger.windingConnectionAngle
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
  ConnectionAngleTapChangerTable:
    description: "Describes a tabular curve for how the connection angle varies with the tap step. This table is used when its winding connection angle matches the operating angle of the tap changer. There must be an instance of this table for each winding connection angle that can be used."
