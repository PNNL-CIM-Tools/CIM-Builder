    description: "Current droop override uses the following logic:- When the current exceeds a threshold the device executes the following transitions: 1) When injecting an inductive voltage or in monitoring mode the device tends to inject a voltage proportional to the difference between the line current and the aforementioned threshold. 2) When injecting a capacitive voltage the device transitions to monitoring mode.- If the aforementioned proportional voltage is lower than the initial one, the voltage injection remains unchanged.Current droop override is not applied when the device operates in currentDroop mode."
