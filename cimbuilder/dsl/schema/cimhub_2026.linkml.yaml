    description: "rdfs:label : Date-time interval@enrdfs:comment : 'intervalo de fecha-hora' es una subclase de 'intervalo propio', definida utilizando el multi-elemento 'descripci�n de fecha-hora'.@es<http://www.w3.org/2004/02/skos/core#note> : 'intervalo de fecha-hora' se puede utilizar s�lo para un intervalo cuyos l�mites coinciden con un elemento de fecha-hora alineados con el calendario y la zona horaria indicados. Por ejemplo, aunque ambos tienen una duraci�n de un d�a, el intervalo de 24 horas que empieza en la media noche del comienzo del 8 mayo en Europa Central se puede expresar como un 'intervalo de fecha-hora', el intervalo de 24 horas que empieza a las 1:30pm no.@esrdfs:label : intervalo de fecha-hora@es<http://www.w3.org/2004/02/skos/core#definition> : DateTimeInterval is a subclass of ProperInterval, defined using the multi-element DateTimeDescription.@enrdfs:comment : DateTimeInterval is a subclass of ProperInterval, defined using the multi-element DateTimeDescription.@en<http://www.w3.org/2004/02/skos/core#note> : :DateTimeInterval can only be used for an interval whose limits coincide with a date-time element aligned to the calendar and timezone indicated. For example, while both have a duration of one day, the 24-hour interval beginning at midnight at the beginning of 8 May in Central Europe can be expressed as a :DateTimeInterval, but the 24-hour interval starting at 1:30pm cannot.@en<http://www.w3.org/2004/02/skos/core#definition> : 'intervalo de fecha-hora' es una subclase de 'intervalo propio', definida utilizando el multi-elemento 'descripci�n de fecha-hora'.@es"
