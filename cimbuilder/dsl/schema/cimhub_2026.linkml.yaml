  ACLineSegmentPhase:
    description: "A line segment phase represents one phase (or optionally the neutral) of an alternating current line segment.Under most circumstances there is not a line segment phase for the neutral. However, if a wire assembly is being used and it does not specify phase, a line segment phase must exist for each position in the assembly (including the neutral)."
    annotations:
      ea_guid: "EAID_84627F88_F666_4f07_890A_62622070CD0F"
    is_a: PowerSystemResource
    class_uri: cim:ACLineSegmentPhase
    attributes: 
      phase:
        description: "Phase identifies the phase or neutral connection of the conductor at both ends."
        annotations:
          ea_guid: "EAID_38F4F39B_9236_46fa_9B1C_D7356BDE2E54"
        slot_uri: cim:ACLineSegmentPhase.phase
        range: SinglePhaseKind
        minimum_cardinality: 0
        maximum_cardinality: 1
      sequenceNumber:
        description: "Sequence number provides the numbering for this line segment phase. When impedance is directly described, sequence number binds the phase to the column and row for entries in the per length phase impedance matrix (PhaseImpedanceData of PerLengthPhaseImpedance). When used in conjunction with a wire assembly description, sequence number associates the line segment phase to a position.For a line segment not a part of a parallel line segment group, sequence number starts at one and increments by one through each line segment phase associated with the line segment. If there is a line segment phase for neutral, it is numbered last."
        annotations:
          ea_guid: "EAID_ACC3476D_8979_46f3_A071_224D1BF4D7DD"
        slot_uri: cim:ACLineSegmentPhase.sequenceNumber
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      ACLineSegment:
        description: "The line segment to which the phase belongs."
