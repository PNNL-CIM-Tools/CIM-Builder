  PhaseImpedanceData:
    description: "Per length phase impedance matrix entry describes impedance and conductance matrix element values for a specific row and column of the matrix.The phases to which each entry applies can be determined by means of the row and column attributes which bind to a sequence number provided in either ACLineSegmentPhase or WirePosition (which also specify phase). Due to physical symmetry that is reflected in the matrix, only the lower triangle of the matrix is populated with the row and column method. That is, the column attribute is always less than or equal to the row attribute."
