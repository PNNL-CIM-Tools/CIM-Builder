  PerLengthPhaseImpedance:
    description: "The per length phase impedance matrix expresses impedance and admittance parameters per unit length for n-conductor unbalanced line segments. A phase impedance matrix contains both self impedances for each phase and mutual impedances between pairs of phases. The matrix is stored in symmetric lower triangular format where the diagonal entries represent self-impedances (and have the same value in row and column) and the off diagonal entries represent phase-to-phase impedances (and have different row and column values).The matrix can be use to express impedances for both non-coupled and coupled line segments. Coupled line segments share a single per length phase impedance matrix whose entries reflect the self and mutual impedances of all the phases of all the wires."
    annotations:
      ea_guid: "EAID_048ADD31_9C78_4fb8_93AD_0F89496AC846"
    is_a: PerLengthImpedance
    abstract: true
    class_uri: cim:PerLengthPhaseImpedance
    attributes: 
      conductorCount:
        description: "Conductor count identifies the number of phase, neutral, and other wires represented in the phase impedance matrix and constrains the number of elements in the matrix. Typically, Kron reduction is used for incorporating effects of neutral impedance in the phase conductor values (so conductor count only considers phase wires), but neutrals can be included in the matrix (in which case conductor count would include the neutral wire(s)). For a phase impedance matrix associated with the lines of a coupled line segment group, the conductor count reflects the total of the conductors associated with all the coupled line segments in the group."
        annotations:
          ea_guid: "EAID_B1A3AD9B_B326_480a_AA6F_4905351CDB64"
        slot_uri: cim:PerLengthPhaseImpedance.conductorCount
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
  PerLengthSequenceImpedance:
    description: "Sequence impedance and admittance parameters per unit length, for transposed line segments of 1, 2, or 3 phases. For 1-phase line segments, define x = x0 = xself. For 2-phase line segments, define x = xself - xmutual and x0 = xself + xmutual."
