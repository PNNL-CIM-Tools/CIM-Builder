  LoadResponseCharacteristic:
    description: "Models the characteristic response of the load demand due to changes in system conditions such as voltage and frequency. It is not related to demand response.If LoadResponseCharacteristic.exponentModel is True, the exponential voltage or frequency dependent models are specified and used as to calculate active and reactive power components of the load model.The equations to calculate active and reactive power components of the load model are internal to the power flow calculation, hence they use different quantities depending on the use case of the data exchange.The equations for exponential voltage dependent load model injected power are:pInjection= Pnominal* (Voltage/cim:BaseVoltage.nominalVoltage) ** cim:LoadResponseCharacteristic.pVoltageExponentqInjection= Qnominal* (Voltage/cim:BaseVoltage.nominalVoltage) ** cim:LoadResponseCharacteristic.qVoltageExponentpInjection = Pnominal* (Frequency/(Nominal frequency))**cim:LoadResponseCharacteristic.pFrequencyExponentqInjection = Qnominal* (Frequency/(Nominal frequency))**cim:LoadResponseCharacteristic.qFrequencyExponentNote that both voltage and frequency exponents could be used together so the full equation would be:pInjection = Pnominal* (Voltage/(cim:BaseVoltage.nominalVoltage))**cim:LoadResponseCharacteristic.pVoltageExponent * (Frequency/(base frequency))**cim:LoadResponseCharacteristic.pFrequencyExponentqInjection = Qnominal* (Voltage/(cim:BaseVoltage.nominalVoltage))**cim:LoadResponseCharacteristic.qVoltageExponent * (Frequency/(base frequency))**cim:LoadResponseCharacteristic.qFrequencyExponentThe voltage and frequency expressed in the equation are values obtained from solved power flow. Base voltage and base frequency are those derived from the connectivity of the static network model.Where:1) * means multiply and ** is raised to the power of;2) Pnominal and Qnominal represent the active power and reactive power at nominal voltage as any load described by the voltage exponential model shall be given at nominal voltage.  This means that EnergyConsumer.p and EnergyConsumer.q  are at nominal voltage.3) After power flow is solved:-pInjection and qInjection correspond to SvPowerflow.p and SvPowerflow.q respectively.- Voltage corresponds to SvVoltage.v at the TopologicalNode where the load is connected."
    annotations:
      ea_guid: "EAID_F80EE4DD_B985_47e3_9832_B5005C24C87E"
    is_a: IdentifiedObject
    abstract: true
    class_uri: cim:LoadResponseCharacteristic
    attributes: 
      exponentModel:
        description: "Indicates the exponential voltage dependency model is to be used. If false, the coefficient model is to be used.The exponential voltage dependency model consist of the attributes:- pVoltageExponent- qVoltageExponent- pFrequencyExponent- qFrequencyExponent.The coefficient model consist of the attributes:- pConstantImpedance- pConstantCurrent- pConstantPower- qConstantImpedance- qConstantCurrent- qConstantPower.The sum of pConstantImpedance, pConstantCurrent and pConstantPower shall equal 1.The sum of qConstantImpedance, qConstantCurrent and qConstantPower shall equal 1."
        annotations:
          ea_guid: "EAID_167B72F6_0FB5_4c24_AD5B_E7D5CEAAFB08"
        slot_uri: cim:LoadResponseCharacteristic.exponentModel
        range: boolean
        minimum_cardinality: 0
        maximum_cardinality: 1
      pConstantCurrent:
        description: "Portion of active power load modelled as constant current."
        annotations:
          ea_guid: "EAID_8173030F_BA74_4d14_9EAF_5BB596D214B2"
        slot_uri: cim:LoadResponseCharacteristic.pConstantCurrent
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      pConstantImpedance:
        description: "Portion of active power load modelled as constant impedance."
        annotations:
          ea_guid: "EAID_2BA696F5_28B3_47b8_9C5A_312BDD6C4325"
        slot_uri: cim:LoadResponseCharacteristic.pConstantImpedance
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      pConstantPower:
