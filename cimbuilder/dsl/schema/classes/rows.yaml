id: https://github.com/AAndersn/CIM-Builder/cimtbl/rows
name: cimtbl_rows
description: >-
  <Class>Row classes (design: CIMTBL_DESIGN.md §12.2) - one per CIM class in
  the ieee13 sample set (Phase 2 scope). Each is a real cimhub_2026 class
  (`is_a`) plus the DSL-only mixins it needs (extensions.yaml) for
  connectivity/phases/Template columns. gen-python turns each into
  `<Class>Row(<RealCIMClass>)`.

  FK slots (BaseVoltage, PerLengthImpedance, LoadResponse, ...) are left as
  the real class's own object-ranged slot here - do NOT slot_usage-narrow
  them to `range: string`. gen-python's dataclass inheritance chain always
  runs the ancestor's __post_init__ after the subclass's, and the ancestor
  unconditionally tries `TargetClass(**as_dict(value))` on that slot; once a
  subclass narrows it to str, `as_dict(a_string)` returns the string
  unchanged and `TargetClass(**a_string)` crashes
  (`TypeError: argument after ** must be a mapping, not str`). validate.py
  (§12.2) is where FK columns are kept as unresolved name strings: it
  excludes FK slots before constructing the LinkML class (so this
  ancestor-coercion path never runs) and passes the raw string straight
  through into the final row - resolving the name into a live object is
  Phase 4/5's job (NameIndex.get, §5.5), never Phase 2's.

  Transformer tank/assembly modeling is a known-shallow pass here pending a
  C57.12-aligned overhaul (~2 weeks out) - PowerTransformerEnd is implemented
  in full since it's stable; TransformerTank/TransformerTankEnd only expose
  their real cimhub_2026 attributes, no DSL extension work. TransformerAssembly
  and TransformerWinding are not in cimhub_2026 (§3.7's note that
  TransformerAssembly is a proposed, not-yet-standardized CIM18 construct) and
  are intentionally absent until that overhaul lands.

  Does NOT import cimhub_2026.linkml or classes/extensions itself - only
  main.yaml does, as flat siblings. PythonGenerator uses the legacy
  SchemaLoader path (uses_schemaloader=True), which flattens nested relative
  imports against the wrong base directory instead of each file's own
  directory (unlike SchemaView.merge_imports, which resolves correctly).
  Always import this file through main.yaml, never generate directly from it
  standalone unless you also import cimhub_2026.linkml/extensions there too.
prefixes:
  linkml: https://w3id.org/linkml/
  cimtbl: https://github.com/AAndersn/CIM-Builder/cimtbl/
default_prefix: cimtbl
default_range: string

imports:
  - linkml:types

classes:

  # --- catalog / base objects (no connectivity, no phases) ---

  BaseVoltageRow:
    is_a: BaseVoltage

  BaseFrequencyRow:
    is_a: BaseFrequency

  BasePowerRow:
    is_a: BasePower

  EnergySourceRow:
    is_a: EnergySource

  LoadResponseCharacteristicRow:
    is_a: LoadResponseCharacteristic

  PerLengthPhaseImpedanceRow:
    is_a: PerLengthPhaseImpedance

  PhaseImpedanceDataRow:
    is_a: PhaseImpedanceData

  ConductorDistanceSpacingRow:
    is_a: ConductorDistanceSpacing

  ConductorDistanceRow:
    is_a: ConductorDistance

  # --- lines (two header shapes, §3.4: bus1/bus2 pu/seq vs node1/node2 per-length/phase) ---

  ACLineSegmentRow:
    is_a: ACLineSegment
    mixins:
      - TwoNodeMixin
      - TwoBusMixin
      - PhasesMixin

  # --- loads ---

  EnergyConsumerRow:
    is_a: EnergyConsumer
    mixins:
      - OneNodeMixin

  EnergyConsumerPhaseRow:
    is_a: EnergyConsumerPhase

  # --- shunt compensators ---

  LinearShuntCompensatorRow:
    is_a: LinearShuntCompensator
    mixins:
      - OneNodeMixin

  LinearShuntCompensatorPhaseRow:
    is_a: LinearShuntCompensatorPhase

  # --- switches ---

  LoadBreakSwitchRow:
    is_a: LoadBreakSwitch
    mixins:
      - TwoNodeMixin

  FuseRow:
    is_a: Fuse
    mixins:
      - TwoNodeMixin

  SectionaliserRow:
    is_a: Sectionaliser
    mixins:
      - TwoNodeMixin

  SwitchPhaseRow:
    is_a: SwitchPhase

  # --- inverter-based DER ---

  PowerElectronicsConnectionRow:
    is_a: PowerElectronicsConnection
    mixins:
      - OneNodeMixin

  PhotoVoltaicUnitRow:
    is_a: PhotoVoltaicUnit

  BatteryUnitRow:
    is_a: BatteryUnit

  # --- transformers (shallow pass - see file description) ---

  PowerTransformerRow:
    is_a: PowerTransformer
    mixins:
      - TemplateRefMixin

  PowerTransformerEndRow:
    is_a: PowerTransformerEnd
    mixins:
      - OneNodeMixin

  TransformerTankRow:
    is_a: TransformerTank

  TransformerTankEndRow:
    is_a: TransformerTankEnd
