[tool.poetry]
name = "cim-builder"
version = "v0.0.1a"
description = "Simplified Dictionaries of CIM data"
authors = ["A. Anderson <19935503+AAndersn@users.noreply.github.com>"]
packages = [
    { include = "cimbuilder" }
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

cim-graph = "^0.3.2a2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pre-commit = "^2.17.0"
graphviz = "^0.19.1"
ipykernel = "^6.27.1"

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"
