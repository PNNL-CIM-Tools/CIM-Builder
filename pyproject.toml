[project]
name = "cim-builder"
version = "0.1.1"
description = "Simplified Dictionaries of CIM data"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cim-tables>=0.1.1a1",
    "cim-profiles>=0.2.0a6,<0.3.0",
    "pyarrow>=18",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=2.17.0",
    "graphviz>=0.19.1",
    "ipykernel>=6.27.1",
]
# the GitHub Pages site (mkdocs.yml); mkdocs-jupyter's markdown_cell_processor needs Python 3.12+
docs = [
    "mkdocs-material>=9.7",
    "mkdocs-jupyter>=0.27; python_version >= '3.12'",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimbuilder"]
