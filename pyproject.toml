[project]
name = "cim-builder"
version = "0.0.1a0"
description = "Simplified Dictionaries of CIM data"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cim-graph>=0.5.0a2,<0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=2.17.0",
    "graphviz>=0.19.1",
    "ipykernel>=6.27.1",
]

[tool.uv]
# cim-graph 0.5 and its deps (gridappsd-python) are pre-release builds
prerelease = "allow"

# Develop against the local cim-graph 0.5 checkout — it carries cgmes_3_0_0
# profile fixes not yet in the published 0.5.0a2 wheel. Drop once published.
[tool.uv.sources]
cim-graph = { path = "/home/ande188/CIM-Graph", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimbuilder"]
