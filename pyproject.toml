[project]
name = "cim-builder"
version = "0.0.1a0"
description = "Simplified Dictionaries of CIM data"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cim-graph>=0.4.3a10",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=2.17.0",
    "graphviz>=0.19.1",
    "ipykernel>=6.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimbuilder"]
