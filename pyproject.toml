[project]
name = "cim-builder"
version = "0.1.1"
description = "Simplified Dictionaries of CIM data"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cim-tables>=0.2.a0",
    "pyarrow>=18",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=2.17.0",
    "graphviz>=0.19.1",
    "ipykernel>=6.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimbuilder"]
